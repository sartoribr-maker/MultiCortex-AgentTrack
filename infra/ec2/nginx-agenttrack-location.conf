# Include only inside the existing devcore HTTPS server block.
location = /agenttrack {
    return 308 /agenttrack/;
}
location ^~ /agenttrack/ {
    # Keep the prefix: this separate Next.js build uses basePath=/agenttrack.
    proxy_pass http://127.0.0.1:3103;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1m;
}

# Public distribution explicitly authorized; no secrets in this package.
location = /agenttrack/downloads/devcore-universal-agent.zip {
    alias /var/lib/devcore-agenttrack-downloads/devcore-universal-agent.zip;
    default_type application/zip;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

# Service package publication explicitly authorized by the user.
location = /agenttrack/downloads/devcore-agent-service.zip {
    alias /var/lib/devcore-agenttrack-downloads/devcore-agent-service.zip;
    default_type application/zip;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
