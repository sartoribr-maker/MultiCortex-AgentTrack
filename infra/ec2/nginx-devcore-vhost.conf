# Modelo do vhost do painel no nginx do EC2 (/etc/nginx/vhosts.d/devcore.conf).
# Na virada, só o proxy_pass muda: 127.0.0.1:3001 (site) -> 127.0.0.1:3002 (DevCore Monitor).
server {
    listen 443 ssl;
    server_name devcore.multicortex.com.br;
    # ssl_certificate … (certbot --nginx -d devcore.multicortex.com.br) — manter o que já existe
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    client_max_body_size 3m;   # o app limita a ingestão a 2 MB e responde 413 acima disso
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
