# Instalado no EC2 como /etc/nginx/devcore-monitor/ingest-location.conf e incluído no
# server { listen 443; server_name site.multicortex.com.br; } de
# /etc/nginx/vhosts.d/multicortex.conf (linha "include …" logo após o server_name).
# O nginx escolhe o prefixo mais longo, então esta regra vence o "location /" (:3001).
# Os agentes já instalados enviam para https://site.multicortex.com.br/api/devcore/ingest/<id>
# (e .../<id>/live); com esta regra, esse caminho passa a chegar ao DevCore Monitor.
# Pode ser removida quando todos os agentes usarem https://devcore.multicortex.com.br/... .
location /api/devcore/ingest/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 3m;   # o app limita a 2 MB e responde 413 acima disso
}
