# FUTURE CUTOVER ONLY. Replaces the AgentTrack include in the HTTPS vhost.
# Also change only that vhost's root proxy_pass from 3002 to 3004.
# Keep SSL directives, /teste/ and other virtual hosts untouched.
location ^~ /agenttrack/api/devcore/agents/ {
    # Existing installed agents retain their URLs, identity and credentials.
    rewrite ^/agenttrack(/api/devcore/agents/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3004;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1m;
}
location = /agenttrack { return 302 /; }
location /agenttrack/ { return 302 /; }
# Preserve only the previously authorized public download endpoints.
location = /agenttrack/downloads/devcore-universal-agent.zip {
    alias /var/lib/devcore-agenttrack-downloads/devcore-universal-agent.zip;
    default_type application/zip;
    add_header Cache-Control "no-store";
}
location = /agenttrack/downloads/devcore-agent-service.zip {
    alias /var/lib/devcore-agenttrack-downloads/devcore-agent-service.zip;
    default_type application/zip;
    add_header Cache-Control "no-store";
}
