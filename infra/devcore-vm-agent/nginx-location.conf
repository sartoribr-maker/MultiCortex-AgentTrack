# Managed by devcore-vm-agent/install.sh — included inside the devcore01 server block.
# The token map lives in /etc/nginx/conf.d/devcore-metrics-token.conf (mode 600).
location = /poc/metrics.json {
    access_log off;
    if ($devcore_metrics_authorized = 0) {
        add_header WWW-Authenticate 'Bearer realm="devcore-metrics"' always;
        return 401;
    }
    #ALLOW_LINE#
    alias /srv/www/devcore-metrics/metrics.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
